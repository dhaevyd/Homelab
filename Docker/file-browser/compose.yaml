services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "0:0"
    volumes:
      - /:/srv
      - ./config/filebrowser.db:/database.db
      - ./config/.filebrowser.json:/.filebrowser.json
    ports:
      - 9080:80
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`filebro.local.d4rkcyber.xyz`)"
      - "traefik.http.routers.filebrowser.entrypoints=https"
      - "traefik.http.routers.filebrowser.tls=true"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=9080"

networks:
  proxy:
    external: true