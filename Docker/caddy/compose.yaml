services:
  caddy:
    image: caddy:latest
    container_name: caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./zerossl:/etc/ssl
      - ./caddy_data:/data
      - ./caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
