services:
  code-server:
    image: lscr.io/linuxserver/code-server:4.135.0
    container_name: code-server
    env_file: .env
    volumes:
      - ./config:/config
      - /home/dami/.ssh/config:/config/.ssh/config:ro
      - /home/dami/docker:/config/project/docker
      - /home/dami/python:/config/project/python
      - /home/dami:/config/project/dami
    ports:
      - 8443:8443
    restart: unless-stopped
    networks:
       - proxy


networks:
  proxy:
    name: proxy
    external: true
