services:  
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:latest
    container_name: nebula-sync
    env_file: .env
    environment:
    # - PRIMARY=http://192.168.2.19:5580|${WEBPASSWORD}
    # - REPLICAS=http://192.168.2.20|${WEBPASSWORD2}
    - PRIMARY=http://192.168.2.19:5580|${WEBPASSWORD}
    - REPLICAS=https://pi2.local.d4rkcyber.xyz|${WEBPASSWORD2}
    - FULL_SYNC=false
    - RUN_GRAVITY=true
    - SYNC_GRAVITY=true
    - SYNC_ADLISTS=true
    - SYNC_WHITELISTS=true
    - SYNC_BLACKLISTS=true
    - SYNC_REGEX_WHITELISTS=true
    - SYNC_REGEX_BLACKLISTS=true
    - SYNC_CLIENTS=true
    - SYNC_GROUPS=true
    - SYNC_LOCAL_DNS_RECORDS=true
    - SYNC_LOCAL_CNAME_RECORDS=true
    - SYNC_CONFIG=false
    - CRON=* * * * *
    networks:
    - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true